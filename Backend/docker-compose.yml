version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ps5_user
      POSTGRES_PASSWORD: ps5_pass
      POSTGRES_DB: ps5_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001" 
    volumes:
      - minio_data:/data

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ps5_user:ps5_pass@db:5432/ps5_db
      S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      - db
      - minio

volumes:
  pgdata:
  minio_data:
